name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate project versions are in sync
        run: python .github/scripts/check_versions.py

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          cd whatsapp-mcp-server
          uv venv
          uv pip install ruff
      - name: Run ruff check
        run: |
          cd whatsapp-mcp-server
          uv run ruff check .
      - name: Run ruff format check
        run: |
          cd whatsapp-mcp-server
          uv run ruff format --check .

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: whatsapp-bridge
      - name: golangci-lint (tray build)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: whatsapp-bridge
          args: --build-tags tray

  go-build-tray:
    name: Go Build (tray, ${{ matrix.os }})
    # Informational until the tray build has been stable for a while.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          cd whatsapp-bridge
          go build -tags tray -v ./...
          go test -tags tray -run 'Tray|PNGToICO|RotateLog|OpenAndClipboard|PairingPageURL|Health' ./...

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build
        run: |
          cd whatsapp-bridge
          go build -v ./...

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          cd whatsapp-mcp-server
          uv venv
          uv pip install -e ".[dev]"
      - name: Run tests
        run: |
          cd whatsapp-mcp-server
          uv run pytest -v
